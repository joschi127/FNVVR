# d3d9.vrPreviewWidth = 1000

# The Pip-Boy on the menu panel (d3d9.vrPipBoyPanel): the part of the Pip-Boy's
# screen texture shown, as shares of its width and height. The default holds
# the menus with a dark rim around them, as on the wrist; it is widened or
# heightened as needed so that nothing is stretched.

# d3d9.vrPipBoyPanelCropLeft = 0.018
# d3d9.vrPipBoyPanelCropTop = 0.0
# d3d9.vrPipBoyPanelCropRight = 0.758
# d3d9.vrPipBoyPanelCropBottom = 0.712

# Width of the casing drawn around the Pip-Boy's screen on the panel, as a
# share of the panel's width (0 for none).

# d3d9.vrPipBoyPanelFrame = 0.022

# Radius of the Pip-Boy panel's rounded outer corners, as a share of its width
# (0 for square corners). The default follows the screen's corners through
